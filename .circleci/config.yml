version: 2.1

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - main

jobs:
  build:
    working_directory: ~/ExampleApplication
    docker:
      - image: circleci/node:10.16.3
    steps:
      - checkout
      - run:
          name: update-npm
          command: sudo npm install -g npm@5
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: install-npm
          command: npm install
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules

  deploy:
    docker:
      - image: circleci/node:10.16.3
    steps:
      - add_ssh_keys
      - run:
          name: Deploy application to EC2
          command: |
            ssh -o StrictHostKeyChecking=accept-new \
              "$EC2_USERNAME@$EC2_PUBLIC_DNS" 'bash -se' \<<'REMOTE'
            cd "$HOME/ExampleApplication"
            git pull --ff-only origin main
            bash deploy.sh
            REMOTE
